services:
  bookshelf:
    image: ghcr.io/axsddlr/bookshelf:softcover
    container_name: bookshelf-softcover
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Etc/UTC
    volumes:
      - ./config-softcover:/config
      - /path/to/books:/books
      - /path/to/downloads:/downloads
    ports:
      - "8788:8787"
    restart: unless-stopped
